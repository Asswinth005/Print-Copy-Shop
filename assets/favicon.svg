<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Brand rounded squircle base matching PrintCraft logo -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none"/>

  <!-- Top input paper sheet -->
  <rect x="20" y="10" width="24" height="14" rx="3" fill="#FFFFFF" opacity="0.92"/>
  <rect x="24" y="14" width="16" height="2" rx="1" fill="#93C5FD"/>
  <rect x="24" y="18" width="10" height="2" rx="1" fill="#93C5FD"/>

  <!-- Printer Main Body -->
  <rect x="11" y="22" width="42" height="22" rx="6" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Output slot -->
  <rect x="17" y="37" width="30" height="3" rx="1.5" fill="#1E293B"/>

  <!-- CMYK dots & Status LED -->
  <circle cx="18" cy="28" r="2" fill="#0EA5E9"/>
  <circle cx="23" cy="28" r="2" fill="#EC4899"/>
  <circle cx="28" cy="28" r="2" fill="#F59E0B"/>
  <circle cx="46" cy="28" r="2.2" fill="#10B981"/>

  <!-- Printed Output Document -->
  <rect x="18" y="38" width="28" height="15" rx="3" fill="url(#paperGrad)" filter="url(#shadow)"/>
  <rect x="22" y="42" width="20" height="2" rx="1" fill="#2563EB"/>
  <rect x="22" y="46" width="14" height="2" rx="1" fill="#64748B"/>
  <rect x="22" y="50" width="10" height="1.5" rx="0.75" fill="#94A3B8"/>
</svg>
